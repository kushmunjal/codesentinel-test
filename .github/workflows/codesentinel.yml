name: CodeSentinel
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write
  statuses: write

jobs:
  codesentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kushmunjal/codesentinel-ai@main
        with:
          provider: 'groq'
          model: 'qwen/qwen3.8-27b'
          api_key: ${{ (startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'demo/scenario-g')) && secrets.EMPTY_SECRET || secrets.LLM_API_KEY }}
          base_url: 'https://api.groq.com/openai/v1'
          github_token: ${{ secrets.GITHUB_TOKEN }}
